openapi: 3.0.0
info:
  title: FlexCN Northbound API
  description: |
    This API allows xApps to communicate with FlexCN.
  version: 1.0.0
paths:
  # Whole stats
  /v1/stats:
    get:
      summary: return every stats that FlexCN has. 
      description: Retrieves all stats that FlexCN received from 5G core components without processing.
      operationId: get-stats
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stats"

  # stats per each ue
  /v1/stats/{ueid}:
    parameters:
      - $ref: "#/components/parameters/ueid"
    get:
      summary: Get stats for a single ue. 
      description: Retrieves all the stats that are related to a given ue, 
                   after aggregating information from mutiple sources.
      operationId: get-stats-per-ue
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mark"
        "400":
          description: The provided parameters are incorrect
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/errorMessage"
              example: "Illegal coordinates"
components:
  parameters:
    ueid:
      description: id of each ue
      name: ueid
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ueid"
  schemas:
    networkStats:
      type: array
      minItems: 0
      description: An array of information.
    errorMessage:
      type: string
      maxLength: 256
      description: A text message describing an error
    ueid:
      type: string
      description: a short form unique determine id of ue and 4g/5g services it is using.
      example: "imsi-11111111111"
    mark:
      type: string
      enum: [".", "X", "O"]
      description: Possible values for a board square. `.` means empty square.
      example: "."
    board:
      type: array
      maxItems: 3
      minItems: 3
      items:
        type: array
        maxItems: 3
        minItems: 3
        items:
          $ref: "#/components/schemas/mark"
    status:
      type: object
      properties:
        winner:
          $ref: "#/components/schemas/winner"
        board:
          $ref: "#/components/schemas/board"
    smfEvent:
      type: object
      properties:
        winner:
          $ref: "#/components/schemas/winner"
        board:
          $ref: "#/components/schemas/board"
    statPerUE:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ueid"
        